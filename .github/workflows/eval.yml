name: eval

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      compare_judges:
        description: "Also measure candidate judge models against the human labels"
        type: boolean
        default: false

jobs:
  # Hard gate: fully offline (mock backend + heuristic judge). Always runs, no
  # secret required, deterministic — this is the build-blocking regression gate.
  eval-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: unit tests
        run: python -m pytest tests/ -q
      - name: eval regression gate (escalation accuracy >= 0.50)
        run: python evals/run.py --model mock --judge mock --validate-judge --gate 0.50

  # Real benchmark against Claude. Runs only when the ANTHROPIC_API_KEY secret
  # is configured (Settings > Secrets and variables > Actions). Applies a
  # tighter gate since the real model should beat the keyword baseline.
  eval-claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: eval with Claude (skips if no secret)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping the real-model eval."
            exit 0
          fi
          python evals/run.py --model anthropic --judge anthropic --validate-judge --gate 0.75

  # On-demand: measure candidate judge models against the human labels so the
  # judge is chosen on evidence. Cheap (one call per label per model), so it is
  # opt-in via workflow_dispatch rather than running on every push.
  compare-judges:
    if: github.event_name == 'workflow_dispatch' && inputs.compare_judges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: compare judges (skips if no secret)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping the judge comparison."
            exit 0
          fi
          echo "### Judges vs the 15 human labels" | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/compare_judges.py \
            --models claude-opus-4-8,claude-sonnet-5,claude-haiku-4-5 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### Judges vs the 30 independent-model (Opus) reference labels" | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/compare_judges.py \
            --labels evals/reference_labels.jsonl --verdict-key verdict \
            --models claude-opus-4-8,claude-sonnet-5,claude-haiku-4-5 \
            | tee -a "$GITHUB_STEP_SUMMARY"
